<!doctype html>
<!-- Rendered to public/assets/og-image.png (1200x630) at build time.
     This is the picture that appears when the site is shared on WhatsApp,
     Facebook, LinkedIn, Slack or iMessage. -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 520px at 88% 8%, rgba(23,162,184,.55), transparent 62%),
      radial-gradient(700px 480px at 6% 92%, rgba(12,111,168,.6), transparent 60%),
      #08243a;
    padding: 56px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; align-items: center; gap: 16px; }
  .top b { font-size: 31px; font-weight: 700; letter-spacing: -.02em; }
  h1 { font-size: 66px; line-height: 1.06; letter-spacing: -.035em; font-weight: 750; max-width: 20ch; }
  h1 em { font-style: normal; color: #6fd3e8; }
  p.sub { font-size: 27px; color: rgba(255,255,255,.86); margin-top: 18px; max-width: 34ch; line-height: 1.3; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { border: 2px solid rgba(255,255,255,.32); border-radius: 999px; padding: 7px 17px; font-size: 20px; font-weight: 600; }
  .price { text-align: right; flex: 0 0 auto; }
  .price small { display: block; font-size: 19px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.7); }
  .price b { font-size: 54px; font-weight: 750; letter-spacing: -.03em; color: #ffb04d; }
</style></head>
<body>
  <div class="top">
    <svg width="58" height="58" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="10" fill="url(#g)"/>
      <path d="M11 15h18M11 20h18M11 25h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".92"/>
      <circle cx="28.5" cy="25" r="2.6" fill="#fff" opacity=".92"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
        <stop stop-color="#3b9fd8"/><stop offset="1" stop-color="#35c9dd"/>
      </linearGradient></defs>
    </svg>
    <b>Better Be Cool</b>
  </div>

  <div>
    <h1>Air conditioning<br>installed <em>properly</em>,<br>across London</h1>
    <p class="sub">Prices published up front. Free survey, fixed written quote.</p>
  </div>

  <div class="bottom">
    <div class="chips">
      <span class="chip">F-Gas certified</span>
      <span class="chip">Part P electricians</span>
      <span class="chip">Fully insured</span>
    </div>
    <div class="price"><small>One room, fitted from</small><b>£1,895</b></div>
  </div>
</body></html>
